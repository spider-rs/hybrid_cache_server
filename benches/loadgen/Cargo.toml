[package]
name = "loadgen"
version = "0.1.0"
edition = "2021"
publish = false
description = "Load generator for hybrid_cache_server benchmarks."

# Standalone crate: not a member of the server package.
[workspace]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "brotli", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
fastrand = "2"

[profile.release]
debug = false
